<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema acadêmico para gerenciamento de notas de alunos">
    <title>SGNA | Gestão de Notas Acadêmicas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>SGNA</h1>
        <p>Sistema de Gestão de Notas Acadêmicas</p>
    </header>

    <main>
        <section id="cadastro">
            <h2>Lançamento de Notas</h2>
            <p>Cadastre o aluno e informe suas notas para calcular a média.</p>

            <form id="form-notas">
                <div>
                    <label for="nome">Nome do aluno</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite o nome completo"
                        required
                    >
                </div>

                <div>
                    <label for="matricula">Matrícula</label>
                    <input
                        type="text"
                        id="matricula"
                        name="matricula"
                        placeholder="Ex.: 2026001"
                        required
                    >
                </div>

                <div>
                    <label for="nota1">Nota 1 (0 a 10)</label>
                    <input
                        type="number"
                        id="nota1"
                        name="nota1"
                        min="0"
                        max="10"
                        step="0.1"
                        required
                    >
                </div>

                <div>
                    <label for="nota2">Nota 2 (0 a 10)</label>
                    <input
                        type="number"
                        id="nota2"
                        name="nota2"
                        min="0"
                        max="10"
                        step="0.1"
                        required
                    >
                </div>

                <button type="submit">Cadastrar e calcular média</button>
            </form>

            <p id="mensagem" role="status" aria-live="polite"></p>
        </section>

        <section id="resultados">
            <h2>Alunos cadastrados</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Aluno</th>
                            <th>Matrícula</th>
                            <th>Nota 1</th>
                            <th>Nota 2</th>
                            <th>Média</th>
                            <th>Situação</th>
                        </tr>
                    </thead>
                    <tbody id="lista-alunos">
                        <tr>
                            <td colspan="6">
                                Nenhum aluno cadastrado.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>SGNA | Projeto Integrador de Programação Web</p>
    </footer>
</body>
</html>
